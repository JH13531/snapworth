name: Deploy to GitHub Pages

# 各 action 均固定在使用 Node 24 运行时的版本，避免 Node 20 弃用告警。
# node-version: 22 是构建用的 Node（与本地开发一致），与 action 运行时无关。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # SheetJS 0.20.3 发布在官方 CDN，npm 官方源没有该版本
      - run: npm ci --no-audit --no-fund
      # 仓库名为 snapworth，Pages 项目站地址为 https://<用户名>.github.io/snapworth/
      # --base 让静态资源走子路径；App 的 BrowserRouter basename 同步取自 BASE_URL
      - run: npx tsc -b && npx vite build --base=/snapworth/
      # GitHub Pages 对未知路径返回 404；复制一份 index.html 作为 404.html，
      # 浏览器地址不变，SPA 启动后由前端路由接管（/analytics 等深链可直达）
      - run: cp dist/index.html dist/404.html
      # v5 把内部依赖的 upload-artifact 升到 v7（Node 24）；
      # v4 钉的是 upload-artifact v4.6.2（Node 20），会残留弃用告警
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
